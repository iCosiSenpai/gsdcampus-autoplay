# Fa lavorare Kiro sulle issue etichettate `kiro`.
#
# Percorso alternativo alla GitHub App di Kiro: quella vive in Kiro Web, che in
# preview è limitato alla regione US. L'API key invece è una funzione della CLI
# e non ha quel vincolo, quindi da qui l'agente si usa comunque.
#
# Serve il secret KIRO_API_KEY (Settings → Secrets and variables → Actions),
# generato su app.kiro.dev → API Keys. Richiede un piano Kiro Pro o superiore.
#
# L'etichettatura la fa kiro-triage.yml, che passa a Kiro solo le fasi in cui il
# difetto è nel repo: qui reagiamo alla label, non decidiamo chi la merita.
#
# ATTENZIONE alla catena di fiducia. kirodotdev-labs è l'org "Kiro Labs"
# (sperimentale, non l'org ufficiale kirodotdev) e questa action ha pochi utenti.
# Le diamo `contents: write`, e `main` di questa repo viene installato dai Mac
# aziendali col comando curl: una versione malevola arriverebbe sui Mac dei
# colleghi. Per questo l'action è pinnata al SHA COMPLETO e non al tag mobile
# `v0`, che può essere spostato senza preavviso. Per aggiornarla, cambia il SHA
# a mano dopo aver letto il diff — mai passare a un tag.
name: Kiro lavora le auto-report

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

# Nessun permesso di default: il job alza solo ciò che gli serve.
permissions: {}

jobs:
  kiro:
    # Solo la label `kiro` o un `/kiro` esplicito in un commento. Senza questo
    # filtro il job partirebbe a ogni etichetta e a ogni commento della repo.
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'kiro') ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/kiro'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Verifica che il secret esista
        id: gate
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: |
          if [ -z "${KIRO_API_KEY:-}" ]; then
            echo "KIRO_API_KEY non configurato: non faccio nulla."
            echo "Aggiungilo in Settings → Secrets and variables → Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinnata al SHA di v0.2.0. NON sostituire con @v0: vedi nota in testa.
      #
      # Lasciamo i default dell'action: label_trigger `kiro`, trigger_phrase
      # `/kiro`, branch_prefix `kiro/`. Nota che kiro_args vale `--trust-all-tools`,
      # cioè l'agente esegue i suoi strumenti senza chiedere conferma: è il motivo
      # per cui `main` va protetto e le sue PR vanno lette prima del merge.
      - name: Kiro
        if: steps.gate.outputs.ok == 'true'
        uses: kirodotdev-labs/kiro-action@4833047fba811f466f7dd7e6a4e861b42a8b89d3
        with:
          kiro_api_key: ${{ secrets.KIRO_API_KEY }}
