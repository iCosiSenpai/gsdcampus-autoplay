# Gira le segnalazioni automatiche all'agente di Amazon Q Developer.
#
# Q Developer è già installato come GitHub App su questa repo (crea da sé la
# label "Amazon Q development agent"). Etichettando una issue, l'agente la
# legge, scrive il codice e apre una PR. È gratuito entro un limite mensile di
# esecuzioni, alzabile registrando l'installazione con l'account AWS.
#
# Q Developer NON è Kiro: sono due prodotti AWS distinti. Kiro resta un'opzione
# (serve piano Pro + API key), ma finché Q fa il lavoro non aggiungiamo né costi
# né action di terze parti con permessi di scrittura su questa repo.
#
# Perché filtrare invece di etichettare tutto: le auto-report arrivano da tutti
# i Mac della flotta e la maggior parte NON è un bug di codice. Un link di
# autologin scaduto o un corso bloccato da una domanda senza risposta non si
# risolvono con una patch, e girarli all'agente brucerebbe il limite mensile per
# produrre PR da buttare. Passano quindi solo le classi in cui il difetto è nel
# repo.
name: Instrada auto-report all agente

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    # La label auto-report la mette il receiver col PAT del maintainer: un utente
    # qualsiasi della repo pubblica non può applicarla, quindi è un gate valido.
    if: contains(github.event.issue.labels.*.name, 'auto-report')
    runs-on: ubuntu-latest
    steps:
      - name: Etichetta per l agente se è un problema di codice
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Il titolo passa da variabile d'ambiente, MAI interpolato nello script:
          # la repo è pubblica e un titolo è testo controllato da chi apre l'issue.
          TITLE: ${{ github.event.issue.title }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Titolo: "[auto-report] [mac-ab12cd] <fase>: <motivo>"
          phase=$(printf '%s' "$TITLE" \
            | sed -n 's/^\[auto-report\][[:space:]]*\(\[[^]]*\][[:space:]]*\)\{0,1\}\([a-z_]*\).*/\2/p')

          echo "Fase rilevata: '${phase:-<nessuna>}'"

          case "$phase" in
            # Il difetto è nel repo: interstitial non gestito, selettori DOM che
            # non combaciano più, crash ripetuti, launcher che non parte, rollback
            # di un aggiornamento.
            post_login_blocked|preflight_failed|crash_loop|auto_update_rollback|scheduler_start_failed|stalled)
              gh issue edit "$NUMBER" --repo "$REPO" \
                --add-label "Amazon Q development agent"
              echo "→ passata all'agente."
              ;;
            # Credenziali o dati del singolo Mac: nessuna patch li risolve.
            autologin_invalid|need_help)
              echo "→ non è un bug di codice: resta al maintainer."
              ;;
            *)
              echo "→ fase non riconosciuta: resta al maintainer."
              ;;
          esac
